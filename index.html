function start(){const M=D[cfg.map];P2={};for(const k in M.P)P2[k]=new Path2D(M.P[k]);const Ts=Object.keys(M.J).sort(()=>Math.random()-.5);
G={M,T:Ts,own:{},n:{},cur:0,ph:'R',pend:0,sel:null,msg:'',win:-1};Ts.forEach((t,i)=>{G.own[t]=i%cfg.n;G.n[t]=1+(Math.random()*3|0)});G.pend=bonus(0);G.msg='Clique nos seus territórios para colocar reforços.';scr='game';hover=''}
function nextPhase(){if(G.ph=='R'){if(G.pend>0){G.msg='Coloque todos os reforços antes de atacar.';return}G.ph='A';G.msg='Selecione um território seu (2+ soldados) e clique num vizinho inimigo.'}
else if(G.ph=='A'){G.ph='F';G.sel=null;G.msg='Reagrupar: selecione origem e clique num vizinho seu para mover 1 soldado.'}
else{do{G.cur=(G.cur+1)%cfg.n}while(!cnt(G.cur));G.ph='R';G.pend=bonus(G.cur);G.msg='Vez do '+PN[G.cur]+': coloque '+G.pend+' reforços.'}G.sel=null}
const roll=n=>Array.from({length:n},()=>1+(Math.random()*6|0)).sort((a,b)=>b-a);
function attack(s,t){const a=Math.min(3,G.n[s]-1),d=Math.min(2,G.n[t]),A=roll(a),Df=roll(d);let la=0,ld=0;for(let i=0;i<Math.min(a,d);i++)A[i]>Df[i]?ld++:la++;G.n[s]-=la;G.n[t]-=ld;
G.msg=`Ataque [${A}] x Defesa [${Df}]  →  atacante -${la}, defensor -${ld}`;
if(G.n[t]<=0){const mv=Math.min(a-la>0?a-la:1,G.n[s]-1)||1;G.own[t]=G.cur;G.n[s]-=mv;G.n[t]=mv;G.msg+='  —  CONQUISTADO!';
if(G.T.every(x=>G.own[x]==G.cur)){G.win=G.cur;scr='win'}}if(G.n[s]<2)G.sel=null}
function clickT(t){if(scr!='game')return;const me=G.own[t]==G.cur,J=G.M.J;
if(G.ph=='R'){if(me&&G.pend>0){G.n[t]++;G.pend--;G.msg=G.pend?`Reforços restantes: ${G.pend}`:'Reforços concluídos. Avance para o ataque.'}}
else if(G.ph=='A'){if(me)G.sel=G.n[t]>1?t:null;else if(G.sel&&J[G.sel].includes(t))attack(G.sel,t);else G.sel=null}
else{if(me&&G.sel&&G.sel!=t&&J[G.sel].includes(t)&&G.n[G.sel]>1){G.n[G.sel]--;G.n[t]++}else G.sel=me&&G.n[t]>1?t:null}}
function draw(){btns=[];c.setTransform(1,0,0,1,0,0);c.fillStyle='#0a1628';c.fillRect(0,0,1920,1080);
if(scr=='menu'){T('Strategic Winner',960,120,90,'#ffdd00');T('Mapa',960,260,40,'#7fa9c9');
B(460,300,480,90,'A = Mundo Equilibrado',()=>cfg.map='A',{sel:cfg.map=='A'});B(980,300,480,90,'B = Mundo Desequilibrado',()=>cfg.map='B',{sel:cfg.map=='B'});
T('Jogadores (multiplayer local: passem o controle)',960,470,40,'#7fa9c9');for(let i=2;i<=6;i++)B(560+(i-2)*160,520,130,90,i,()=>cfg.n=i,{sel:cfg.n==i,z:44});
B(710,740,500,130,'Iniciar Jogo',start,{bg:'#1a8f3a',z:52});T('Regras desta versão: dados 3x2, 1 movimento de reagrupar por clique, vence quem conquistar o mundo',960,960,26,'#9db89d');return}
c.fillStyle='#5bbcd8';c.fillRect(0,0,1920,1080);const M=G.M,J=M.J;
for(const t of G.T){const o=G.own[t];c.globalAlpha=.8;c.fillStyle=COL[o];c.fill(P2[t],'evenodd');c.globalAlpha=1;
const tgt=G.sel&&J[G.sel].includes(t)&&((G.ph=='A'&&o!=G.cur)||(G.ph=='F'&&o==G.cur));
if(hover=='t:'+t){c.fillStyle='rgba(255,255,255,.3)';c.fill(P2[t],'evenodd')}
c.lineJoin='round';c.lineWidth=t==G.sel?7:tgt?6:2.8;c.strokeStyle=t==G.sel?'#fff':tgt?(G.ph=='A'?'#ff2222':'#33ff33'):'#050505';c.stroke(P2[t])}
for(const t of G.T){const [x,y]=M.C[t];T(t,x,y-34,15);c.beginPath();c.arc(x,y,20,0,7);c.fillStyle='rgba(0,0,0,.7)';c.fill();c.lineWidth=3;c.strokeStyle='#fff';c.stroke();T(G.n[t],x,y+1,24)}
for(let i=0;i<cfg.n;i++){const x=30+i*300,al=cnt(i)?1:.3;c.globalAlpha=al;c.fillStyle=COL[i];c.fillRect(x,14,280,46);c.lineWidth=i==G.cur?6:2;c.strokeStyle='#fff';c.strokeRect(x,14,280,46);T(`${PN[i]} · ${cnt(i)}`,x+140,37,24);c.globalAlpha=1}
T(`Vez: ${PN[G.cur]} — Fase: ${{R:'Reforço ('+G.pend+')',A:'Ataque',F:'Reagrupar'}[G.ph]}`,960,92,32,COL[G.cur]);
T(G.msg,30,1040,28,'#fff','left');B(1500,960,390,90,{R:'Ir para Ataque',A:'Ir para Reagrupar',F:'Finalizar Turno'}[G.ph],nextPhase,{z:30});
if(scr=='win'){c.fillStyle='rgba(0,0,0,.75)';c.fillRect(0,0,1920,1080);T(PN[G.win]+' venceu!',960,420,100,COL[G.win]);B(710,560,500,110,'Voltar ao Menu',()=>{scr='menu';hover=''},{z:40})}}
function pick(x,y){for(const b of btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return{b};
if(scr=='game')for(const t of G.T)if(c.isPointInPath(P2[t],x,y,'evenodd'))return{t};return null}
const key=h=>h?(h.b?'b:'+h.b.k:'t:'+h.t):'';
function onHover(x,y){const k=key(pick(x,y));if(k!=hover){hover=k;draw();tex.needsUpdate=true}}
function onClick(x,y){const h=pick(x,y);if(!h)return;h.b?h.b.fn():clickT(h.t);hover='';draw();tex.needsUpdate=true}
/* ===== SALA 3D ===== */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;R.xr.setReferenceSpaceType('local-floor');document.body.append(R.domElement,VRButton.createButton(R));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060c);const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,60);cam.position.set(0,1.6,0);
const rig=new THREE.Group();rig.add(cam);scene.add(rig);
scene.add(new THREE.HemisphereLight(0xffffff,0x332233,1.1));const pl=new THREE.PointLight(0xffe0b0,25,14);pl.position.set(0,5,2);scene.add(pl);
const M_=(col,o={})=>new THREE.MeshStandardMaterial({color:col,roughness:.85,...o});
const box=(w,h,d,x,y,z,m,p=scene)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o};
box(16,.1,20,0,-.05,1,M_(0x3a0f1a));box(16,.1,20,0,6,1,M_(0x15151f));box(16,6,.1,0,3,-9,M_(0x1a1a2a));box(16,6,.1,0,3,11,M_(0x1a1a2a));box(.1,6,20,-8,3,1,M_(0x1a1a2a));box(.1,6,20,8,3,1,M_(0x1a1a2a));
box(1.6,5.6,.3,-6.4,3,-8.8,M_(0x8a1020));box(1.6,5.6,.3,6.4,3,-8.8,M_(0x8a1020));
for(let i=-3;i<=3;i+=2)box(.6,.05,.6,i*2,5.95,2,new THREE.MeshBasicMaterial({color:0xffe9b0}));
function seat(x,z,w,col){const g=new THREE.Group(),m=M_(col),a=(sx,sy,sz,px,py,pz,rx=0)=>{const o=box(sx,sy,sz,px,py,pz,m,g);o.rotation.x=rx};
a(w,.4,.55,0,.2,0);a(w-.1,.12,.5,0,.46,.02);a(w-.1,.85,.14,0,.85,.3,.12);a(.1,.3,.5,-w/2,.55,0);a(.1,.3,.5,w/2,.55,0);g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<4;i++)seat(-2.4+i*1.6,2.4,1.1,0x9b1b30);          // poltronas
for(let r=0;r<2;r++)for(let i=0;i<6;i++)seat(-3+i*1.2,4.4+r*1.8,.75,0x23305e); // cadeiras
const tex=new THREE.CanvasTexture(S);tex.colorSpace=THREE.SRGBColorSpace;tex.generateMipmaps=false;tex.minFilter=THREE.LinearFilter;tex.anisotropy=4;
box(10.4,5.9,.15,0,3.4,-8.95,M_(0x000000));
const screen=new THREE.Mesh(new THREE.PlaneGeometry(10,5.625),new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));screen.position.set(0,3.4,-8.85);scene.add(screen);
/* ===== PONTEIROS / CONTROLES ===== */
const ray=new THREE.Raycaster(),tm=new THREE.Matrix4(),ctl=[];
function aim(k){tm.identity().extractRotation(k.matrixWorld);ray.ray.origin.setFromMatrixPosition(k.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(tm);const h=ray.intersectObject(screen)[0];return h&&{x:h.uv.x*1920,y:(1-h.uv.y)*1080,d:h.distance}}
for(let i=0;i<2;i++){const k=R.xr.getController(i);const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xffffff}));ln.scale.z=3;k.add(ln);k.userData.ln=ln;
k.addEventListener('selectstart',()=>{const h=aim(k);if(h)onClick(h.x,h.y)});rig.add(k);ctl.push(k)}
/* mouse (teste no PC) */
const nd=new THREE.Vector2();R.domElement.addEventListener('pointermove',e=>{if(R.xr.isPresenting)return;nd.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(nd,cam);const h=ray.intersectObject(screen)[0];if(h)onHover(h.uv.x*1920,(1-h.uv.y)*1080)});
R.domElement.addEventListener('click',e=>{if(R.xr.isPresenting)return;nd.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(nd,cam);const h=ray.intersectObject(screen)[0];if(h)onClick(h.uv.x*1920,(1-h.uv.y)*1080)});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
/* ===== LOOP: andar (stick esq.), girar (stick dir.) ===== */
const clk=new THREE.Clock(),q=new THREE.Quaternion(),f=new THREE.Vector3(),rt=new THREE.Vector3();let snapped=false;
R.setAnimationLoop(()=>{const dt=Math.min(clk.getDelta(),.1),s=R.xr.getSession();
if(s){R.xr.getCamera().getWorldQuaternion(q);f.set(0,0,-1).applyQuaternion(q);f.y=0;f.normalize();rt.set(-f.z,0,f.x);
for(const src of s.inputSources){const g=src.gamepad;if(!g)continue;const x=g.axes[2]??g.axes[0]??0,y=g.axes[3]??g.axes[1]??0;
if(src.handedness=='left'&&Math.hypot(x,y)>.15){rig.position.addScaledVector(f,-y*2.2*dt).addScaledVector(rt,x*2.2*dt);rig.position.x=THREE.MathUtils.clamp(rig.position.x,-7.2,7.2);rig.position.z=THREE.MathUtils.clamp(rig.position.z,-8,10.2)}
if(src.handedness=='right'){if(Math.abs(x)>.7&&!snapped){rig.rotation.y-=Math.sign(x)*Math.PI/6;snapped=true}else if(Math.abs(x)<.3)snapped=false}}
let hk=null;for(const k of ctl){const h=aim(k);k.userData.ln.scale.z=h?h.d:3;if(h&&!hk)hk=h}if(hk)onHover(hk.x,hk.y)}
R.render(scene,cam)});
draw();tex.needsUpdate=true;
