function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const IW = 1920, IH = 1080; // resolução interna do "monitor" do jogo (bate com o design original em 1920x1080, evita cortar telas como o resumo da partida)
const frame = document.getElementById('gameFrame');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');

frame.addEventListener('load', () => {
  loadingEl.style.display = 'none';
  startBtn.disabled = false;
  statusEl.textContent = 'Jogo carregado. Pronto para VR.';
  beginCaptureLoop();
});
frame.srcdoc = b64ToUtf8(GAME_HTML_B64);

/* =========================================================
   2) Cena 3D minimalista (leve): uma "tela" plana com o jogo
      texturizado nela + um chão simples. Nada de luzes pesadas,
      sombras, pós-processamento, etc.
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1220);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.05, 100);
const dolly = new THREE.Group(); // grupo que o WASD move; a câmera/headset se move dentro dele
dolly.add(camera);
dolly.position.set(0, 1.6, 1.6);
scene.add(dolly);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

// luz simples e barata
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.0));

// chão simples (referência espacial, poucos triângulos)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshBasicMaterial({ color:0x0e1a2b })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);
const grid = new THREE.GridHelper(20, 20, 0x2a4a68, 0x16283c);
scene.add(grid);

// "tela" com o jogo (canvas texture atualizado periodicamente)
const canvasEl = document.createElement('canvas');
canvasEl.width = IW; canvasEl.height = IH;
const ctx2d = canvasEl.getContext('2d');
ctx2d.fillStyle = '#0a1628'; ctx2d.fillRect(0,0,IW,IH);
const texture = new THREE.CanvasTexture(canvasEl);
texture.minFilter = THREE.LinearFilter;
texture.magFilter = THREE.LinearFilter;

const SCREEN_W = 2.8;
const SCREEN_H = SCREEN_W * (IH/IW);
const screenMat = new THREE.MeshBasicMaterial({ map: texture });
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, SCREEN_H), screenMat);
screenMesh.position.set(0, 1.5, -2.0);
scene.add(screenMesh);

// moldura leve só por estética (sem custo real)
const frameMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(SCREEN_W+0.08, SCREEN_H+0.08),
  new THREE.MeshBasicMaterial({ color:0x0a1a2e })
);
frameMesh.position.set(0, 1.5, -2.01);
scene.add(frameMesh);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   3) Captura periódica (leve) do jogo real -> textura
   ========================================================= */
let capturing = false;
let captureBlocked = false; // pausa a captura durante arraste/clique pra não travar o VR
let pendingCapture = false;
let captureFailCount = 0;
let mutObserver = null;
let debounceTimer = null;

function doCapture(){
  if (capturing || captureBlocked) { pendingCapture = capturing; return; }
  const doc = frame.contentDocument;
  if (!doc || !doc.body) return;
  capturing = true;
  html2canvas(doc.body, {
    backgroundColor: '#0a1628',
    logging: false,
    useCORS: true,
    foreignObjectRendering: true, // tenta o modo rápido; se o navegador não suportar com segurança, cai sozinho pro modo compatível (nunca fica em branco)
    scale: 0.65,
    width: IW,
    height: IH,
    windowWidth: IW,
    windowHeight: IH
  }).then(c => {
    ctx2d.clearRect(0,0,canvasEl.width,canvasEl.height);
    ctx2d.drawImage(c, 0, 0, canvasEl.width, canvasEl.height);
    texture.needsUpdate = true;
    captureFailCount = 0;
    capturing = false;
    if (pendingCapture){ pendingCapture = false; doCapture(); }
  }).catch(()=>{
    capturing = false;
    captureFailCount++;
    if (captureFailCount === 15) statusEl.textContent = 'Aviso: a atualização da tela pode estar falhando neste navegador.';
  });
}

function scheduleCapture(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doCapture, 120); // junta várias mudanças rápidas numa só foto
}

function beginCaptureLoop(){
  const doc = frame.contentDocument;
  // captura só quando algo MUDA de verdade no jogo (clique, texto, telas) -> muito mais leve
  // que ficar tirando fotos o tempo todo sem necessidade
  if (doc && doc.body && 'MutationObserver' in window){
    mutObserver = new MutationObserver(scheduleCapture);
    mutObserver.observe(doc.body, { attributes:true, childList:true, subtree:true, characterData:true });
  }
  // rede de segurança bem espaçada, pra pegar mudanças só de CSS (ex: hover) que não mexem no DOM
  setInterval(doCapture, 700);
  doCapture();
}

/* =========================================================
   4) Encaminhar cliques/arrastos reais para dentro do jogo
   ========================================================= */
// encontra o ancestral mais próximo que realmente tem scroll (ex: painéis de resumo/lista)
function findScrollable(el, doc){
  let node = el;
  while (node && node !== doc.documentElement){
    let oy = 'visible';
    try{ oy = doc.defaultView.getComputedStyle(node).overflowY; }catch(e){}
    if ((oy === 'auto' || oy === 'scroll') && node.scrollHeight > node.clientHeight + 2) return node;
    node = node.parentElement;
  }
  if (doc.body && doc.body.scrollHeight > doc.body.clientHeight + 2) return doc.body;
  if (doc.documentElement.scrollHeight > doc.documentElement.clientHeight + 2) return doc.documentElement;
  return null;
}

let dragScrollEl = null, dragLastX = 0, dragLastY = 0;

function forwardPointer(type, u, v, buttons){
  const doc = frame.contentDocument;
  if (!doc) return;
  const x = Math.max(0, Math.min(IW-1, Math.round(u*IW)));
  const y = Math.max(0, Math.min(IH-1, Math.round((1-v)*IH)));
  const target = doc.elementFromPoint(x, y) || doc.body;
  const opts = {
    bubbles:true, cancelable:true, view: frame.contentWindow,
    clientX:x, clientY:y, button:0, buttons: buttons||0, pointerId:1, isPrimary:true
  };
  try{
    if(type==='down'){
      dragScrollEl = findScrollable(target, doc);
      dragLastX = x; dragLastY = y;
      target.dispatchEvent(new PointerEvent('pointerdown', {...opts, pointerType:'mouse'}));
      target.dispatchEvent(new MouseEvent('mousedown', opts));
    }else if(type==='move'){
      // arraste real dentro de qualquer painel com scroll (ex: tela de resumo da partida)
      if (dragScrollEl){
        dragScrollEl.scrollTop -= (y - dragLastY);
      }
      dragLastX = x; dragLastY = y;
      target.dispatchEvent(new PointerEvent('pointermove', {...opts, pointerType:'mouse'}));
      target.dispatchEvent(new MouseEvent('mousemove', opts));
    }else if(type==='up'){
      target.dispatchEvent(new PointerEvent('pointerup', {...opts, pointerType:'mouse'}));
      target.dispatchEvent(new MouseEvent('mouseup', opts));
      target.dispatchEvent(new MouseEvent('click', opts));
      dragScrollEl = null;
    }
  }catch(e){ /* silencioso: mantém leve, não quebra o loop */ }
  return target;
}

const raycaster = new THREE.Raycaster();
let dragging = false;
let dragStart = null;

function raycastScreen(originVec, dirVec){
  raycaster.set(originVec, dirVec);
  const hit = raycaster.intersectObject(screenMesh, false)[0];
  if (!hit) return null;
  return hit.uv;
}

// ---- Modo desktop (antes/sem headset ativo): mouse do PC ----
const ndc = new THREE.Vector2();
function mouseToUV(evt){
  ndc.x = (evt.clientX/window.innerWidth)*2 - 1;
  ndc.y = -(evt.clientY/window.innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(screenMesh, false)[0];
  return hit ? hit.uv : null;
}
renderer.domElement.addEventListener('pointerdown', (e)=>{
  if (renderer.xr.isPresenting) return;
  const uv = mouseToUV(e);
  if (!uv) return;
  dragging = true;
  captureBlocked = true;
  forwardPointer('down', uv.x, uv.y, 1);
});
window.addEventListener('pointermove', (e)=>{
  if (renderer.xr.isPresenting || !dragging) return;
  const uv = mouseToUV(e);
  if (uv) forwardPointer('move', uv.x, uv.y, 1);
});
window.addEventListener('pointerup', (e)=>{
  if (renderer.xr.isPresenting) return;
  if (!dragging) return;
  dragging = false;
  const uv = mouseToUV(e);
  if (uv) forwardPointer('up', uv.x, uv.y, 0);
  captureBlocked = false;
  doCapture();
});

// ---- Modo VR real: raio do controle + gatilho ----
function setupController(index){
  const controller = renderer.xr.getController(index);
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)
  ]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:0x7fd0ff }));
  line.name = 'ray';
  line.scale.z = 1;
  controller.add(line);

  const origin = new THREE.Vector3();
  const dir = new THREE.Vector3();

  controller.addEventListener('selectstart', ()=>{
    controller.updateMatrixWorld();
    origin.setFromMatrixPosition(controller.matrixWorld);
    dir.set(0,0,-1).applyQuaternion(controller.quaternion).transformDirection(controller.matrixWorld).normalize();
    const uv = raycastScreen(origin, dir);
    if (uv){ dragging = true; captureBlocked = true; forwardPointer('down', uv.x, uv.y, 1); controller.userData.dragging = true; }
  });
  controller.addEventListener('selectend', ()=>{
    if (!controller.userData.dragging) return;
    controller.updateMatrixWorld();
    origin.setFromMatrixPosition(controller.matrixWorld);
    dir.set(0,0,-1).applyQuaternion(controller.quaternion).transformDirection(controller.matrixWorld).normalize();
    const uv = raycastScreen(origin, dir);
    if (uv) forwardPointer('up', uv.x, uv.y, 0);
    controller.userData.dragging = false;
    dragging = false;
    captureBlocked = false;
    doCapture();
  });
  scene.add(controller);
  return controller;
}
const ctrl0 = setupController(0);
const ctrl1 = setupController(1);

function updateControllerDrag(controller){
  if (!controller.userData.dragging) return;
  controller.updateMatrixWorld();
  const origin = new THREE.Vector3().setFromMatrixPosition(controller.matrixWorld);
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(controller.quaternion).transformDirection(controller.matrixWorld).normalize();
  const uv = raycastScreen(origin, dir);
  if (uv) forwardPointer('move', uv.x, uv.y, 1);
}

/* =========================================================
   5) WASD / setas para andar (funciona fora e dentro do VR)
   ========================================================= */
const keys = {};
window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()] = false; });

const SPEED = 1.6; // m/s
const fwd = new THREE.Vector3();
const right = new THREE.Vector3();
const clock = new THREE.Clock();

function updateMovement(){
  const dt = Math.min(clock.getDelta(), 0.1);
  let mx=0, mz=0;
  if (keys['w']||keys['arrowup'])    mz -= 1;
  if (keys['s']||keys['arrowdown'])  mz += 1;
  if (keys['a']||keys['arrowleft'])  mx -= 1;
  if (keys['d']||keys['arrowright']) mx += 1;
  if (mx||mz){
    const len = Math.hypot(mx,mz); mx/=len; mz/=len;
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
    dolly.position.addScaledVector(fwd, -mz*SPEED*dt);
    dolly.position.addScaledVector(right, mx*SPEED*dt);
    // mantém dentro de uma área confortável perto da tela
    dolly.position.x = Math.max(-2.2, Math.min(2.2, dolly.position.x));
    dolly.position.z = Math.max(0.5, Math.min(4.5, dolly.position.z));
  }
}

/* =========================================================
   6) Botão de entrar em VR (usa o botão padrão WebXR)
   ========================================================= */
const vrBtn = VRButton.createButton(renderer);
vrBtn.style.display = 'none'; // escondido: usamos nosso botão estilizado que dispara o clique dele
document.body.appendChild(vrBtn);
startBtn.addEventListener('click', ()=>{
  if (vrBtn.textContent.includes('NOT SUPPORTED') || vrBtn.textContent.includes('SUPPORTED')){
    statusEl.textContent = 'Este navegador/dispositivo não expôs suporte a WebXR. Abra em um navegador com WebXR (ex: dentro do headset, ou Chrome com um runtime VR ativo).';
  }
  vrBtn.click();
});

renderer.xr.addEventListener('sessionstart', ()=>{ statusEl.textContent = 'Em VR — use o gatilho do controle para clicar.'; });
renderer.xr.addEventListener('sessionend',   ()=>{ statusEl.textContent = 'Saiu do VR.'; });

/* =========================================================
   7) Loop principal (leve: sem sombra, sem pós-processo)
   ========================================================= */
renderer.setAnimationLoop(()=>{
  updateMovement();
  updateControllerDrag(ctrl0);
  updateControllerDrag(ctrl1);
  renderer.render(scene, camera);
});
</script>
